kind = "web"
previewPath = "/jnickae-candles/"
title = "J'Nickae Candles"
version = "1.0.0"
id = "artifacts/jnickae-candles"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/jnickae-candles/" ]
localPort = 25197

[services.development]
run = "pnpm --filter @workspace/jnickae-candles run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jnickae-candles", "run", "build" ]
publicDir = "artifacts/jnickae-candles/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25197"
BASE_PATH = "/jnickae-candles/"
